<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tabfold — Settings</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="page stack">
      <header>
        <p class="brand">Tabfold</p>
        <h1 id="title">Settings</h1>
      </header>

      <div
        id="status"
        class="banner fold"
        role="status"
        aria-live="polite"
        hidden
      ></div>

      <section class="panel stack" id="settings-form">
        <label class="check">
          <input type="checkbox" id="remove-after" />
          <span id="label-remove"></span>
        </label>
        <label>
          <span id="label-scope"></span>
          <select id="default-scope"></select>
        </label>
        <label>
          <span id="label-theme"></span>
          <select id="theme"></select>
        </label>
        <label>
          <span id="label-whitelist"></span>
          <textarea id="whitelist" rows="5"></textarea>
          <span class="muted" id="whitelist-hint"></span>
        </label>
        <button type="button" class="primary" id="btn-save"></button>
        <p class="muted" id="saved-msg" hidden></p>
      </section>

      <section class="panel stack">
        <h2>Where is my data stored?</h2>
        <p id="where-data"></p>
        <div class="row wrap">
          <button type="button" id="btn-export"></button>
          <button type="button" id="btn-export-raw"></button>
          <button type="button" class="danger" id="btn-reset"></button>
        </div>
      </section>

      <section class="panel stack">
        <h2 id="backups-title"></h2>
        <div id="backups" class="stack"></div>
      </section>

      <section class="panel stack">
        <h2 id="shortcuts-title"></h2>
        <p class="muted" id="shortcuts-body"></p>
      </section>

      <p class="muted mono" id="version-line"></p>
    </div>
    <script type="module" src="options.js"></script>
  </body>
</html>
