<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tabfold — Library</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="list.css" />
  </head>
  <body>
    <div class="page stack">
      <header class="page-header">
        <div>
          <p class="brand">Tabfold</p>
          <p class="muted" id="subtitle"></p>
        </div>
        <div class="row wrap">
          <button type="button" class="primary" id="btn-save"></button>
          <button type="button" id="btn-hibernate"></button>
          <button type="button" id="btn-restore-all"></button>
          <button type="button" id="btn-settings"></button>
        </div>
      </header>

      <div
        id="status"
        class="banner"
        role="status"
        aria-live="polite"
        hidden
      ></div>
      <div id="stats" class="stats mono muted"></div>

      <section class="panel stack" id="targets-panel">
        <h2 id="targets-title"></h2>
        <div class="row wrap">
          <select id="target-tab" aria-label="Target tab"></select>
          <button type="button" id="btn-refresh-targets"></button>
        </div>
      </section>

      <div class="toolbar row wrap">
        <input type="search" id="search" />
        <select id="group-filter" aria-label="Filter by group"></select>
        <button type="button" id="btn-export"></button>
        <button type="button" id="btn-import-json"></button>
        <button type="button" id="btn-import-text"></button>
        <input
          type="file"
          id="import-json"
          accept="application/json,.json"
          hidden
        />
        <input type="file" id="import-text" accept="text/plain,.txt" hidden />
        <button type="button" id="btn-demo"></button>
        <button type="button" class="danger" id="btn-clear"></button>
      </div>

      <div id="groups" class="row wrap"></div>
      <div id="list" class="library-list" role="list"></div>
    </div>
    <dialog id="edit-dialog" aria-labelledby="edit-title">
      <form method="dialog" class="stack" id="edit-form">
        <h2 id="edit-title"></h2>
        <label>
          <span id="label-group"></span>
          <input type="text" id="edit-group" />
        </label>
        <label>
          <span id="label-tags"></span>
          <input type="text" id="edit-tags" />
        </label>
        <input type="hidden" id="edit-id" />
        <div class="row">
          <button type="submit" value="cancel" id="edit-cancel"></button>
          <button
            type="submit"
            value="save"
            class="primary"
            id="edit-save"
          ></button>
        </div>
      </form>
    </dialog>
    <dialog id="batch-dialog" aria-labelledby="batch-title">
      <form method="dialog" class="stack">
        <h2 id="batch-title"></h2>
        <p id="batch-text"></p>
        <div class="row wrap">
          <button type="submit" value="cancel" id="batch-cancel"></button>
          <button type="submit" value="all" id="batch-all"></button>
          <button
            type="submit"
            value="batch"
            class="primary"
            id="batch-ok"
          ></button>
        </div>
      </form>
    </dialog>
    <script type="module" src="list.js"></script>
  </body>
</html>
