<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tabfold</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="popup-body">
    <div id="app" class="stack popup">
      <header class="popup-header">
        <div>
          <p class="brand">Tabfold</p>
          <p class="muted tagline" id="tagline"></p>
        </div>
        <div class="row">
          <button type="button" class="ghost" id="btn-settings"></button>
          <button type="button" class="ghost" id="btn-library"></button>
        </div>
      </header>

      <div
        id="status"
        class="banner fold"
        role="status"
        aria-live="polite"
        hidden
      ></div>
      <div id="onboarding" class="stack onboarding" hidden></div>

      <div class="row wrap actions">
        <button type="button" class="primary" id="btn-save"></button>
        <select id="scope" aria-label="Save scope">
          <option value="current">Current tab</option>
          <option value="others">Other tabs</option>
          <option value="window">Entire window</option>
        </select>
        <button type="button" id="btn-hibernate"></button>
      </div>

      <label class="sr-only" for="search">Search</label>
      <input type="search" id="search" autocomplete="off" />

      <div id="list" class="list" role="list"></div>

      <footer class="popup-footer row wrap">
        <button type="button" id="btn-restore-all"></button>
        <button type="button" id="btn-export"></button>
        <button type="button" id="btn-demo"></button>
        <span class="muted mono" id="count"></span>
      </footer>
    </div>
    <dialog id="confirm-dialog" aria-labelledby="confirm-title">
      <form method="dialog" class="stack">
        <h2 id="confirm-title" class="sr-only"></h2>
        <p id="confirm-text"></p>
        <div class="row" id="confirm-actions">
          <button type="submit" value="cancel" id="confirm-cancel"></button>
          <button
            type="submit"
            value="ok"
            class="primary"
            id="confirm-ok"
          ></button>
        </div>
      </form>
    </dialog>
    <dialog id="batch-dialog" aria-labelledby="batch-title">
      <form method="dialog" class="stack">
        <h2 id="batch-title"></h2>
        <p id="batch-text"></p>
        <div class="row wrap">
          <button type="submit" value="cancel" id="batch-cancel"></button>
          <button type="submit" value="all" id="batch-all"></button>
          <button
            type="submit"
            value="batch"
            class="primary"
            id="batch-ok"
          ></button>
        </div>
      </form>
    </dialog>
    <script type="module" src="popup.js"></script>
  </body>
</html>
